# Site settings
title: Elena Shliaga
author: Elena Shliaga
email: elena.shliaga@gmail.com
description: >-
  A laser physicist traps light for a living and explains one physics idea a week:
  semiconductor lasers, photonics of multilayer structures, and computational
  electromagnetics with open code — from first principles, plus research papers
  worth reading.
url: "https://elenashliaga.github.io"
lang: en
timezone: Europe/Moscow
permalink: /:year/:month/:day/:title/

# Build settings
markdown: kramdown
kramdown:
  math_engine: mathjax

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

# Post defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      math: true
