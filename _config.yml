# Site settings
title: Elena Shliaga
author: Elena Shliaga
email: elena.shliaga@gmail.com
description: >-
  Physics blog by a laser physicist: quantum computing explained,
  photonics and lasers, and readable digests of research papers.
url: "https://elenashliaga.github.io"
lang: en
timezone: Europe/Moscow
permalink: /:year/:month/:day/:title/

# Build settings
markdown: kramdown
kramdown:
  math_engine: mathjax

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

# Post defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      math: true
