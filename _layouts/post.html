---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title | escape }}</h1>
    <p class="post-meta">
      {{ page.date | date: '%B %-d, %Y' }}
      {% if page.tags %} · {{ page.tags | join: ' · ' }}{% endif %}
    </p>
  </header>

  {{ content }}

  <footer class="post-footer">
    <p>
      <a href="{{ '/' | relative_url }}">← All posts</a>
    </p>
  </footer>
</article>
